name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.x

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Unit, component and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  build:
    name: Build (prerender + bundle budgets)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # `analyze` runs the same prerender build with the bundle report enabled,
      # then the budget script fails the job on any overage (docs/PERFORMANCE.md).
      - run: pnpm analyze && pnpm exec tsx scripts/check-bundle-size.ts
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/client
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: reports/bundle-stats.html
          retention-days: 7

  seo-contract:
    name: SEO contract
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build/client
      - run: pnpm test:seo

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build/client
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build/client
      - name: Run Lighthouse (mobile, 3 runs per page, asserts targets)
        run: mkdir -p reports && pnpm lighthouse | tee reports/lighthouse-summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: reports/lighthouse
          retention-days: 7
      - name: Comment summary on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const file = 'reports/lighthouse-summary.md';
            if (!fs.existsSync(file)) return;
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
            const table = lines.filter((line) => line.startsWith('|'));
            if (table.length === 0) return;
            const body = ['### Lighthouse (mobile, median of 3)', '', ...table].join(String.fromCharCode(10));
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
